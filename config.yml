# ── 关注语义（2026-09-01 关注解耦 → 2026-09-05 盖章退役）──────
# 旧「关注大牛抓 star 灌新卡」（bigbros 名单 + following_user 自动同步）已整套退役，
# bigbros / following_user 配置项随之移除（config.ts 保留空值兜底解析）。
# 2026-09-05：库内 star 盖章（stampLibraryStars）也停止运行——陌生库作者的 star 对访客
# 零价值，每天却烧上千 GitHub API 配额；bigbros 的全部消费出口（详情弹窗/关注频道/推荐
# 加权/TG 通知/评分加权）同步清除，字段仅为历史数据兼容保留。关注频道只认本机关注。

# ── Trending/Search 主题 ───────────────────────────────────────
# GitHub Search API 查询主题。2026-09-05 十倍扩容：21 主题×50 → ~90 主题×100
# （候选上限 1450/轮 → 9000/轮），领域从 AI/工程扩展到好玩/生活/学习/硬件/科学全谱系。
# 每天评分 cap 1000 张滚动消化（评分队列按领域分桶轮询），池子一周内数量级增长。
# quota = 每主题最多拉取仓库数（Search API 限流 30/min，10 个一批 + 2 秒间隔）
trending_topics:
  # AI 核心
  - { q: "topic:llm", label: "llm", quota: 100 }
  - { q: "topic:ai-agent", label: "ai-agent", quota: 100 }
