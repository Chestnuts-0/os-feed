<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitTok 方向 2 · 点菜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --text: #f0f0f5; --text-secondary: #a0a3b1; --text-muted: #6b6e7f;
  --accent: #6366f1; --accent-light: rgba(99, 102, 241, 0.12);
  --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
  --glass-border: rgba(224, 217, 255, 0.13);
  --glass-shadow: 0 2px 6px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.45);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, 0.1);
  --side-group-bg: linear-gradient(180deg, rgba(38, 32, 62, 0.82) 0%, rgba(24, 20, 40, 0.86) 100%);
  --font-serif: "Lora", "Noto Serif SC", "Times New Roman", "Songti SC", "SimSun", serif;
  --border: rgba(255, 255, 255, 0.08); --success: #22c55e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-serif);
  background: #08060e; background-image: linear-gradient(180deg, #120e1f 0%, #0b0914 45%, #05040a 100%);
  color: var(--text); line-height: 1.65; padding: 32px 24px 64px;
}
.wrap { max-width: 880px; margin: 0 auto; }
h1 { font-size: 1.35rem; margin-bottom: 8px; }
.lead { color: var(--text-secondary); margin-bottom: 12px; font-size: 0.92rem; }
.lock { font-size: 0.82rem; color: var(--success); margin-bottom: 22px; }
.card {
  background: var(--side-group-bg); border: 1px solid var(--glass-border); border-radius: 18px;
  box-shadow: var(--glass-hi), var(--glass-shadow); padding: 18px 20px 16px; margin-bottom: 14px;
}
.n { font-size: 0.75rem; color: var(--accent); font-weight: 700; }
h2 { font-size: 1.02rem; margin: 2px 0 6px; }
.why { font-size: 0.88rem; color: var(--text-secondary); }
.dim { opacity: 0.55; }
.note { margin-top: 22px; font-size: 0.8rem; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>GitTok 方向 2 · 点菜已收口</h1>
  <p class="lead">第四轮点菜已全部记下。生产正在按点菜上线。</p>
  <p class="lock">1 悬停 C · 2 弹窗 H · 3 按钮 J · 4/5/9/10 锁现网 · 6 频道 B · 7 点赞 A · 8 留卡+撤销 · 11 切频道回顶</p>

  <article class="card dim">
    <div class="n">已点菜，不再开新方案</div>
    <h2>会话内不重排</h2>
    <p class="why">点开卡片不再当场改推荐顺序；点踩留在原位。刷新后个性化才生效。</p>
  </article>

  <p class="note">对照页仍可打开作存档，不再作为点菜入口。</p>
</div>
</body>
</html>
